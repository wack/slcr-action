version: 2
updates:
  # "/" covers both .github/workflows and the root action.yml, whose pinned
  # actions/cache commit users run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: deps
