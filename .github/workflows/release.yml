name: Release

# Publishing a release `vX.Y.Z` moves the major version tag `vX` to it, so
# that workflows using `wack/slcr-action@vX` get it. Prereleases don't.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  major-tag:
    name: Move the major version tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # To move the major version tag.
    steps:
      - name: Point the major version tag at the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not a version such as v1.2.3."
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          # A patch to an older minor version mustn't move the tag back.
          newest="$(gh api "repos/$REPOSITORY/git/matching-refs/tags/$major." --jq '.[].ref' |
            sed 's|^refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [[ "$newest" != "$TAG" ]]; then
            echo "$major stays where it is: $newest is newer than $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sha="$(gh api "repos/$REPOSITORY/commits/$TAG" --jq .sha)"
          if gh api "repos/$REPOSITORY/git/ref/tags/$major" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/$major" \
              -f sha="$sha" -F force=true --silent
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$sha" --silent
          fi
          echo "$major now points at $TAG ($sha)." | tee -a "$GITHUB_STEP_SUMMARY"
